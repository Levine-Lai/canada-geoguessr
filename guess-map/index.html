<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图寻落点地图</title>
<link rel="stylesheet" href="../review/vendor/leaflet.css">
<link rel="stylesheet" href="map.css?v=street-points">
<script defer src="../review/vendor/leaflet.js"></script>
<script defer src="../review/data.js"></script>
<script defer src="street.js?v=10km"></script>
<script defer src="app.js?v=10km"></script>
</head>
<body>
<header>
  <h1>图寻落点地图</h1>
  <div class="tools"><button id="fit">全部落点</button><button id="import" class="primary">导入对局</button></div>
</header>
<main>
  <div id="map" aria-label="历史落点地图"></div>
  <aside aria-label="对局和回合">
    <label for="games">对局</label>
    <select id="games"><option value="">全部对局</option></select>
    <fieldset class="distance-filter">
      <legend>误差距离</legend>
      <div>
        <select id="distance-operator" aria-label="距离范围">
          <option value="">不限</option>
          <option value="gt">大于</option>
          <option value="lt">小于</option>
        </select>
        <input id="distance-km" type="number" min="0" step="1" value="300" required aria-label="距离阈值（公里）" aria-describedby="distance-error">
        <span aria-hidden="true">km</span>
      </div>
      <p id="distance-error" role="status" hidden>请输入非负整数公里数。</p>
    </fieldset>
    <div class="summary"><strong id="count">0 个猜测</strong><button id="remove" hidden>删除这局</button></div>
    <label class="toggle"><input id="answers" type="checkbox" checked> 显示答案与误差线</label>
    <div id="rounds"></div>
    <p id="empty">导入历史对局，在同一张地图查看你的猜测。</p>
  </aside>
</main>
<div id="feedback" role="status"></div>
<dialog id="importer">
  <form id="import-form">
    <h2>导入图寻对局</h2>
    <ol>
      <li>登录图寻，<a id="history" target="_blank" rel="noreferrer">打开历史数据</a>，复制页面全部内容并粘贴。</li>
      <li>从下方历史列表打开要导入的对局数据，复制页面全部内容并粘贴。也支持导入已有的复盘 JSON 备份。</li>
    </ol>
    <label for="user-id">图寻用户 ID</label>
    <input id="user-id" type="text" inputmode="numeric" pattern="[0-9]+" value="78526" required>
    <div id="game-id-field" hidden>
      <label for="raw-game-id">对局 ID 或对局数据页网址</label>
      <input id="raw-game-id" type="text">
    </div>
    <label for="payload">图寻数据或复盘备份</label>
    <textarea id="payload" rows="4" required></textarea>
    <div class="tools"><button class="primary" type="submit">读取数据</button><button type="button" id="close">关闭</button></div>
    <p id="import-status" role="status"></p>
    <section id="history-tools" hidden aria-label="历史对局操作">
      <div class="tools">
        <button type="button" id="select-all">全选</button>
        <button type="button" id="clear-selection">清除勾选</button>
        <button type="button" id="import-selected">导入所选</button>
        <button type="button" id="remove-selected">移除所选</button>
      </div>
      <div id="pending-import" hidden>
        <p id="pending-status" role="status"></p>
        <a id="pending-source" target="_blank" rel="noreferrer">打开当前对局数据 ↗</a>
        <label for="pending-payload">粘贴当前对局数据</label>
        <textarea id="pending-payload" rows="3"></textarea>
        <button type="button" id="save-pending">导入这局</button>
      </div>
    </section>
    <div id="history-list"></div>
  </form>
</dialog>
<dialog id="confirm-delete"><form method="dialog"><h2 id="delete-title">移除记录？</h2><div class="tools"><button value="cancel">取消</button><button value="delete" class="primary">移除</button></div></form></dialog>
<dialog id="guess-street" aria-labelledby="guess-street-title">
  <form method="dialog" class="summary"><h2 id="guess-street-title">猜测点附近街景</h2><button>关闭</button></form>
  <p id="street-status" role="status"></p>
  <div id="street-results"></div>
</dialog>
</body>
</html>
